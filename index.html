<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OPX Inventory · iDesign Studio</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap');
  :root{
    --bg:#00202D;--surf:#002E40;--field:#00293A;--line:#20505F;
    --primary:#33C9FF;--primary2:#5CD4FF;--primary90:#47CEFF;--cer10:#EBFAFF;--cer20:#D6F4FF;
    --ocean70:#4DA5C6;--green:#81C784;--text:#E9F3F7;--muted:#8FA8B4;--sub:#B3D9E7;
    --grad:linear-gradient(90deg,rgba(1,80,110,.95) 0%,rgba(0,51,70,.95) 100%);--shadow:0 4px 16px rgba(0,18,26,.25);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Lato',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text);background:var(--bg);min-height:100vh}
  a{color:var(--primary);text-decoration:none}
  /* topbar */
  .topbar{display:flex;align-items:center;gap:16px;padding:14px 26px;background:linear-gradient(135deg,#00263A,#013A52);border-bottom:1px solid var(--line)}
  .topbar .logo{height:24px}
  .topbar .ctx{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:13px;font-weight:700}
  .topbar .ctx b{color:var(--text)}
  .topbar .ctx .sep{color:var(--line)}
  .spacer{flex:1}
  .linklike{color:var(--muted);font-size:12.5px;font-weight:700;cursor:pointer}
  .linklike:hover{color:var(--text)}
  /* layout */
  .shell{display:grid;grid-template-columns:280px 1fr;gap:0;min-height:calc(100vh - 57px)}
  .rail{border-right:1px solid var(--line);padding:20px 16px}
  .rail .rt{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:2px 8px 12px}
  .prow{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:0 12px 0 12px;cursor:pointer;transition:background .12s}
  .prow:hover{background:rgba(137,242,247,.06)}
  .prow.on{background:rgba(51,201,255,.12);box-shadow:inset 0 0 0 1px var(--ocean70)}
  .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .dot.complete{background:var(--green)}.dot.progress{background:#FFCE93}.dot.none{background:#5C7E90}
  .prow .pn{font-size:13.5px;font-weight:700;line-height:1.25}
  .prow .ps{font-size:11px;color:var(--muted)}
  /* main */
  .main{padding:26px 30px 70px;max-width:920px}
  .phead{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:6px}
  .phead h1{font-size:26px;font-weight:900;color:#fff;margin:0}
  .statustag{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;border-radius:20px;padding:3px 10px;align-self:center}
  .statustag.complete{background:#C8E6C9;color:#18551D}.statustag.progress{background:#FFF7E8;color:#7D570A}.statustag.none{background:rgba(137,168,180,.18);color:var(--sub)}
  .contact{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin:8px 0 22px}
  .contact a{color:var(--sub);font-weight:700}
  .contact .k{color:#5C7E90;font-weight:700;text-transform:uppercase;font-size:10.5px;letter-spacing:.04em;margin-right:6px}
  .reqbadge{display:inline-block;color:#18551D;background:#C8E6C9;border-radius:20px;padding:1px 8px;font-size:11px;font-weight:700;white-space:nowrap}
  .reqbadge.arch{color:var(--sub);background:rgba(137,168,180,.2)}
  /* collapsible One-Pagers box + file thumbnails */
  .secbtn{width:100%;background:none;border:none;text-align:left;font-family:inherit;cursor:pointer;color:inherit}
  .secbtn:hover{background:rgba(137,242,247,.04)}
  .sec .chev{color:var(--muted);font-size:16px;font-weight:700;transition:transform .15s;display:inline-block}
  .sec.open .chev{transform:rotate(90deg)}
  .op-body{display:none;padding:2px 20px 18px;border-top:1px solid rgba(137,242,247,.10)}
  .sec.open .op-body{display:block}
  .op-actions{display:flex;gap:10px;margin:14px 0 16px;flex-wrap:wrap}
  .thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px}
  .op-variants{margin-top:6px;display:flex;flex-direction:column;gap:4px}
  .opv{font-size:10px;font-weight:700;color:var(--muted);text-align:center;line-height:1.5}
  .opv a{color:var(--primary)}
  .opv-label{display:inline-block;background:rgba(51,201,255,.14);color:var(--sub);border-radius:8px;padding:1px 7px;margin-right:5px;font-size:9px;text-transform:uppercase;letter-spacing:.04em}
  .thumb{cursor:pointer}
  .thumb .page{aspect-ratio:8.5/11;background:#fff;border-radius:5px;box-shadow:0 2px 9px rgba(0,10,20,.4);overflow:hidden;position:relative;transition:transform .12s,box-shadow .12s}
  .thumb:hover .page{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,10,20,.5)}
  .thumb .pg-band{height:22%}
  .thumb .pg-in{padding:6px 7px}
  .thumb .pg-h{height:5px;width:72%;background:#33405a;border-radius:2px;margin:4px 0 6px}
  .thumb .pg-l{height:3px;width:100%;background:#c9d4dd;border-radius:2px;margin:3px 0}
  .thumb .pg-l.short{width:58%}
  .thumb .pg-img{height:24px;background:#e3e9ee;border-radius:3px;margin-top:6px}
  .thumb .page img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
  .swag-thumb{width:46px;height:46px;border-radius:8px;overflow:hidden;background:#fff;flex:none;box-shadow:0 1px 5px rgba(0,10,20,.35);display:flex;align-items:center;justify-content:center}
  .swag-thumb img{width:100%;height:100%;object-fit:contain;display:block}
  .thumb .st-dot{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 2px #fff}
  .thumb.out .page{background:transparent;border:1.5px dashed var(--line);box-shadow:none;display:flex;align-items:center;justify-content:center}
  .thumb.out:hover .page{transform:none;box-shadow:none}
  .thumb.out .page span{color:var(--muted);font-size:9px;font-weight:700;text-align:center;padding:4px}
  .thumb-cap{font-size:10.5px;color:var(--muted);margin-top:6px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .thumb .page{cursor:pointer}
  .thumb .page.legacy{cursor:default;opacity:.72}
  .op-links{font-size:10px;font-weight:700;text-align:center;margin-top:3px}
  .op-links a{color:var(--primary)}
  .op-links.muted{color:#5C7E90;font-weight:600}
  .thumb .st-dot.rev{background:#E7B35C}
  .op-flag{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:#7D570A;background:#FFF7E8;border-radius:10px;padding:2px 7px;margin:5px auto 0;width:max-content}
  /* section cards */
  .sec{background:var(--grad);border:1px solid var(--ocean70);border-radius:0 16px 0 16px;box-shadow:var(--shadow);padding:0;margin-bottom:16px;overflow:hidden}
  .sech{display:flex;align-items:center;gap:12px;padding:15px 20px 13px}
  .sech .si{width:34px;height:34px;border-radius:9px;background:rgba(51,201,255,.12);color:var(--primary);display:flex;align-items:center;justify-content:center;flex:none}
  .sech .si svg{width:19px;height:19px}
  .sech h2{font-size:15px;font-weight:900;color:#fff;margin:0}
  .sech .cnt{font-size:12px;color:var(--muted);font-weight:700}
  .row{display:flex;align-items:center;gap:14px;padding:13px 20px;border-top:1px solid rgba(137,242,247,.10);flex-wrap:wrap}
  .row .rmain{flex:1;min-width:180px}
  .row .rname{font-size:14px;font-weight:700;color:var(--text)}
  .row .rmeta{font-size:12px;color:var(--muted);margin-top:2px}
  .row .rmeta a{color:var(--sub)}
  .pill{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;border-radius:20px;padding:3px 10px;flex:none}
  .pill.done{background:#C8E6C9;color:#18551D}.pill.pending{background:#FFF7E8;color:#7D570A}.pill.na{background:rgba(137,168,180,.18);color:var(--sub)}
  /* buttons */
  .btn{display:inline-flex;align-items:center;gap:6px;background:rgba(137,242,247,.08);color:var(--text);border:1px solid var(--line);border-radius:24px;padding:8px 15px;font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit;white-space:nowrap;transition:background .12s}
  .btn:hover{background:rgba(137,242,247,.15)}
  .btn.primary{background:var(--primary);color:#00202D;border-color:var(--primary)}
  .btn.primary:hover{background:var(--primary90)}
  .btn.sm{padding:6px 12px;font-size:11.5px}
  .empty{padding:16px 20px;border-top:1px solid rgba(137,242,247,.10);color:var(--muted);font-size:13px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .note{color:#5C7E90;font-size:11.5px;margin-top:14px;line-height:1.5}
  /* toast */
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#083244;border:1px solid var(--ocean70);color:#fff;padding:12px 20px;border-radius:24px;font-size:13.5px;font-weight:700;box-shadow:0 12px 40px rgba(0,10,20,.5);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media(max-width:820px){.shell{grid-template-columns:1fr}.rail{border-right:none;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<header class="topbar">
  <img class="logo" src="Studio-logo-white.svg" alt="iDesign Studio">
  <span class="ctx"><b>OPX Inventory</b><span class="sep">·</span>Partner Audit</span>
  <span class="spacer"></span>
  <span class="linklike" onclick="location.href='https://idesign-creative.github.io/studio-hub/hub.html'">← All tools</span>

<div class="shell">
  <aside class="rail">
    <div class="rt">OPX Partners · <span id="pcount"></span></div>

</div>

<script>
var REVIEW_URL='https://idesign-creative.github.io/brand-site-review/library.html';
var exBtn='';   // Adobe Express removed — one-pagers are now HTML/PDF in /onepagers/
// ---- Studio Review integration (same public Supabase project + anon key the Review app uses) ----
var SUPA_URL='https://puytjdeavhowngzqdymh.supabase.co';
var SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB1eXRqZGVhdmhvd25nenFkeW1oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1MjYyMzEsImV4cCI6MjA5OTEwMjIzMX0.CqC7Sh6d6dNr6hCiT9tpgKPKWsVJpQhsbaJyAYN-kZY';
var SUPA_H={apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY};
var PROXY='https://funny-eagle-3488.idesign-creative.deno.net/';        // reviewer overlay proxy (from the Review app)
var REVIEW_BASE='https://idesign-creative.github.io/brand-site-review/'; // Review dashboard/library base
// Real data from the OPX Partner Audit sheet (coordinator contacts included per approval).
var PARTNERS=[
  {name:'Our Lady of the Lake University', site:'https://onlineprograms.ollusa.edu/', postcard:'done', pens:'na', onepagers:{done:3,total:6}, email:'cramos@ollusa.edu', phone:'(210) 941-1513', files:[
    {prog:'BSW', img:'thumbs/ollu-bsw.jpg'},
    {prog:'MSW', img:'thumbs/ollu-msw.jpg'},

    {prog:'RN-BS',   img:'thumbs/salve-rnbs.jpg'},
    {prog:'DNP',     img:'thumbs/salve-dnp.jpg'},
    {prog:'PMHNP',   img:'thumbs/salve-pmhnp.jpg'},

      // print fields the auto-compare checks against the live microsite when a review is archived
      check:{'Program name':'Family Nurse Practitioner','Tuition':['$39,408','$41,712']},
      // two versions: EPD (personalized with the enrollment rep) + Generic (no rep)
      variants:[
        {label:'EPD',     html:'onepagers/salve-msnfnp.html',         pdf:'onepagers/salve-msnfnp.pdf'},
        {label:'Generic',                                             pdf:'onepagers/salve-msnfnp-generic.pdf'}
      ]},
    {prog:'MHA',     img:'thumbs/salve-mha.jpg'}
  ]},
  {name:'Schreiner University', site:'https://onlinenursing.schreiner.edu/', postcard:'done', pens:'na', onepagers:{done:2,total:2}, email:'cramos@schreiner.edu', phone:'830.307.5814', files:[
    {prog:'MSN-FNP',   img:'thumbs/schreiner-msnfnp.jpg'},
    {prog:'MSN-PMHNP', img:'thumbs/schreiner-msnpmhnp.jpg'}
  ]},
  {name:'University of Texas at Tyler', site:'https://nursingonline.uttyler.edu/', postcard:'pending', pens:'na', onepagers:{done:17,total:18}, email:'cramos@uttler.edu', phone:'(903) 525-6697', files:[
    {prog:'RN-BSN',       img:'thumbs/uttyler-rnbsn.jpg'},
    {prog:'ADN-BSN',      img:'thumbs/uttyler-adnbsn.jpg'},
    {prog:'RN-MSN',       img:'thumbs/uttyler-rnmsn.jpg'},
    {prog:'MSN-FNP',      img:'thumbs/uttyler-msnfnp.jpg'},
    {prog:'MSN-PMHNP',    img:'thumbs/uttyler-msnpmhnp.jpg'},
    {prog:'MSN-Admin',    img:'thumbs/uttyler-msnadmin.jpg'},
    {prog:'MSN-Ed',       img:'thumbs/uttyler-msned.jpg'},
    {prog:'MSN-IQ Safety',img:'thumbs/uttyler-msniqsafety.jpg'},
    {prog:'MSN-MBA',      img:'thumbs/uttyler-msnmba.jpg'},

    {prog:'BSN-PhD',      img:'thumbs/uttyler-bsnphd.jpg'},

    {prog:'PM-AGACNP',    img:'thumbs/uttyler-pmagacnp.jpg'}
  ]},
  {name:'York College of Pennsylvania', site:'https://onlinedegrees.ycp.edu/', postcard:'pending', pens:'na', onepagers:{done:2,total:2}, email:'', phone:'', epd:'Liana Wiemels', files:[
    {prog:'RN-BSN', img:'thumbs/ycp-rnbsn.jpg'},
    {prog:'MSN',    img:'thumbs/ycp-msn.jpg'}
  ]},
  {name:'Rio of Ohio', site:'', postcard:'pending', pens:'na', onepagers:{done:0,total:0}, email:'', phone:'', epd:'Liana Wiemels'}
];

// Printed (postcard) + SWAG deliverables — preview images + reorder data from the per-partner audit tabs.
var DELIV={
  'Our Lady of the Lake University':{
    printed:{status:'revision', img:'thumbs/ollu-postcard.jpg', note:'Wrong QR code — needs update'},
    swag:[{item:'Tablecloth',img:'thumbs/ollu-tablecloth.jpg',qty:'1',last:'Mar 25, 2026',status:'done',vendor:'bestofsigns.com'},
          {item:'Pens',img:'thumbs/ollu-pen.jpg',qty:'300',last:'Mar 25, 2026',status:'done',vendor:'pens.com'}]
  },
  'Salve Regina University':{ printed:{status:'none'}, swag:[{item:'Tablecloth',status:'na'},{item:'Pens',status:'none'}] },
  'Schreiner University':{
    printed:{status:'done', img:'thumbs/schreiner-postcard.jpg', qty:'1K', last:'Feb 11, 2026'},
    swag:[{item:'Tablecloth',status:'na'},{item:'Pens',img:'thumbs/schreiner-pen.jpg',qty:'300',last:'Jun 12, 2026',status:'done',vendor:'pens.com'}]
  },
  'University of Texas at Tyler':{ printed:{status:'none'}, swag:[{item:'Tablecloth',status:'na'},{item:'Pens',status:'none'}] },
  'York College of Pennsylvania':{
    printed:{status:'none'},
    swag:[{item:'Tablecloth',img:'thumbs/york-tablecloth.jpg',qty:'1',last:'Mar 25, 2026',status:'done',vendor:'bestofsigns.com'},
          {item:'Pens',img:'thumbs/york-pen.jpg',qty:'300',last:'Mar 25, 2026',status:'done',vendor:'pens.com'}]
  },
  'Rio of Ohio':{ printed:{status:'none'}, swag:[{item:'Tablecloth',status:'na'},{item:'Pens',status:'none'}] }
};
PARTNERS.forEach(function(p){ var d=DELIV[p.name]; if(d){ p.printed=d.printed; p.swag=d.swag; } });

function statusOf(p){
  if(!p.site && p.onepagers.total===0) return 'none';
  var opDone = p.onepagers.total>0 && p.onepagers.done===p.onepagers.total;
  if(p.postcard==='done' && opDone) return 'complete';
  if(p.postcard==='done' || p.onepagers.done>0) return 'progress';
  return 'none';
}
var STATUS_LABEL={complete:'Complete', progress:'In progress', none:'Not started'};
var sel=0;
var opOpen=true;   // One-Pagers box expanded by default
function toggleOP(){ opOpen=!opOpen; var s=document.getElementById('opsec'); if(s) s.classList.toggle('open',opOpen); }
// Print-sync flags: after a website review is ARCHIVED, an auto-compare checks the
// one-pager's print fields against the live microsite and records a flag here if
// they've drifted (course name / tuition / credit hours). Populated in Phase 2.
var FLAGS={};   // key "Partner|PROG" -> { needs:true, detail:"Verify: Tuition" }
function flagKey(pname,prog){ return pname+'|'+prog; }
function needsRevision(p,f){ var x=FLAGS[flagKey(p.name,f.prog)]; return (x&&x.needs)?(x.detail||'Needs revision'):''; }
function openOnePager(url){ if(url) window.open(url,'_blank','noopener'); }
// friendly download filename, e.g. Salve-Regina-University-MSN-FNP-one-pager.pdf
function dlName(p,f,v){ return (p.name+' '+f.prog+(v&&v.label?' '+v.label:'')+' one-pager').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-+|-+$/g,'')+'.pdf'; }
// Send a one-pager into Studio Review — opens its PDF in the PDF reviewer so the
// team can comment page-by-page. Reuses/creates one review per one-pager PDF.
function opReviewLink(pdfAbs,label){ return REVIEW_BASE+'pdf.html?v='+encodeURIComponent(pdfAbs)+'&name='+encodeURIComponent(label||''); }
function requestOPReview(pdfRel,label){
  var pdfAbs=new URL(pdfRel, location.href).href, link=opReviewLink(pdfAbs,label);
  fetchLatestReview(pdfAbs).then(function(ex){
    if(ex && ex.archived!==true){ copy(link,'Review link copied — one-pager already in Review'); return; }
    return fetch(SUPA_URL+'/rest/v1/reviews',{method:'POST',headers:Object.assign({'Content-Type':'application/json',Prefer:'return=minimal'},SUPA_H),body:JSON.stringify([{url:pdfAbs,name:label||null,project:pdfAbs,created_by:'iDesign · OPX Inventory'}])})
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); copy(link,'One-pager sent to Studio Review — link copied'); });
  }).catch(function(e){ toast('Couldn’t reach Review ('+e.message+')'); });
}
function opThumbs(p){
  var files=p.files||[], op=p.onepagers||{};
  if(files.length){            // one-pagers (HTML + PDF in /onepagers/)
    var h='<div class="thumbs">';
    files.forEach(function(f){
      var vs=f.variants||((f.html||f.pdf)?[{label:'',html:f.html,pdf:f.pdf}]:[]);
      var built=false, openUrl='';
      vs.forEach(function(v){ if(v.html||v.pdf) built=true; if(!openUrl&&v.html) openUrl=v.html; });
      if(!openUrl) vs.forEach(function(v){ if(!openUrl&&v.pdf) openUrl=v.pdf; });
      var flag=needsRevision(p,f);   // print-sync flag (set after a website review is archived)
      if(built){
        var vhtml=vs.map(function(v){
          if(!v.html&&!v.pdf) return '';
          var a=[];
          if(v.html) a.push('<a href="'+v.html+'" target="_blank" rel="noopener">View</a>');
          if(v.pdf) a.push('<a href="'+v.pdf+'" download="'+dlName(p,f,v)+'" title="Download current version (PDF)">Download</a>');
          if(v.pdf) a.push('<a href="javascript:void 0" onclick="requestOPReview(\''+v.pdf.replace(/'/g,"\\'")+'\',\''+(p.name+' '+f.prog+(v.label?' ('+v.label+')':'')).replace(/'/g,"\\'")+'\');return false" title="Send to Studio Review">Review</a>');
          return '<div class="opv">'+(v.label?'<span class="opv-label">'+esc(v.label)+'</span>':'')+a.join(' · ')+'</div>';
        }).join('');
        h+='<div class="thumb" title="'+esc(f.prog)+' one-pager">'
          +'<div class="page" onclick="openOnePager(\''+openUrl+'\')"><span class="st-dot'+(flag?' rev':'')+'"></span>'+(f.img?'<img src="'+f.img+'" alt="'+esc(f.prog)+' one-pager">':'')+'</div>'
          +'<div class="thumb-cap">'+esc(f.prog)+'</div>'
          +'<div class="op-variants">'+vhtml+'</div>'
          +(flag?'<div class="op-flag" title="'+esc(flag)+'">Needs revision</div>':'')
          +'</div>';
      } else {
        h+='<div class="thumb" title="'+esc(f.prog)+' — not yet rebuilt as an HTML one-pager">'
          +'<div class="page legacy">'+(f.img?'<img src="'+f.img+'" alt="'+esc(f.prog)+'">':'')+'</div>'
          +'<div class="thumb-cap">'+esc(f.prog)+'</div><div class="op-links muted">PDF pending</div></div>';
      }
    });
    return h+'</div>';
  }
  // fallback: no real files — branded placeholders from the sheet count
  var total=op.total||0; if(!total) return '';
  var bands=['#33C9FF','#0E7FB0','#6F2C3E','#F0AB00','#3E7C59','#565A5C'];
  var g='<div class="thumbs">';
  for(var i=0;i<total;i++){
    var cap='One-pager '+(i+1);
    if(i<(op.done||0)){
      g+='<div class="thumb" title="'+cap+'" onclick="toast(\'Opening '+cap+'…\')"><div class="page"><span class="st-dot"></span>'
        +'<div class="pg-band" style="background:'+bands[i%bands.length]+'"></div><div class="pg-in"><div class="pg-h"></div>'
        +'<div class="pg-l"></div><div class="pg-l"></div><div class="pg-l short"></div><div class="pg-img"></div></div></div>'
        +'<div class="thumb-cap">'+cap+'</div></div>';
    } else {
      g+='<div class="thumb out" title="'+cap+' — not started"><div class="page"><span>Not started</span></div><div class="thumb-cap">'+cap+'</div></div>';
    }
  }
  return g+'</div>';
}

function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function icon(p){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';}
var IC={
  web:icon('<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 2.5 15 0 18M12 3c-2.5 2.5-2.5 15 0 18"/>'),
  doc:icon('<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M9 12h6M9 16h4"/>'),
  print:icon('<rect x="6" y="3" width="12" height="6"/><path d="M6 18H4v-6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v6h-2"/><rect x="8" y="15" width="8" height="6"/>'),
  swag:icon('<path d="M5 8h14l-1 12H6z"/><path d="M9 8a3 3 0 0 1 6 0"/>'),
  event:icon('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/>')
};

function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(function(){t.classList.remove('show');},2200);}
function copy(txt,msg){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){toast(msg);},function(){toast(msg);});}else toast(msg);}
function siteReviewLink(url){ return PROXY+'?url='+encodeURIComponent(url); }
function hostOf(url){ try{return new URL(url).hostname;}catch(e){return url;} }
function reviewDashLink(url){ return REVIEW_BASE+'dashboard.html?site='+encodeURIComponent(hostOf(url)); }
function fmtReqDate(ts){ try{return new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});}catch(e){return '';} }
// Latest review for this microsite (any state). archived flag drives the 3-state UI.
function fetchLatestReview(url){
  return fetch(SUPA_URL+'/rest/v1/reviews?url=eq.'+encodeURIComponent(url)+'&order=created_at.desc&limit=1&select=id,url,name,created_at,archived',{headers:SUPA_H})
    .then(function(r){return r.ok?r.json():[];})
    .then(function(rows){return (rows&&rows[0])||null;})
    .catch(function(){return null;});
}
function copyReviewLink(url){ copy(siteReviewLink(url),'Review link copied — reuse it until the review is archived'); }
// Create the review in Studio Review (records the request date), or reuse the active one, then copy the link.
function requestReview(btn,url,name){
  if(btn){ btn.disabled=true; btn.textContent='Requesting…'; }
  fetchLatestReview(url).then(function(existing){
    if(existing && existing.archived!==true){ copyReviewLink(url); return refreshWebReview(PARTNERS[sel]); } // active → reuse, don't duplicate
    return fetch(SUPA_URL+'/rest/v1/reviews',{method:'POST',headers:Object.assign({'Content-Type':'application/json',Prefer:'return=minimal'},SUPA_H),body:JSON.stringify([{url:url,name:name||null,project:hostOf(url),created_by:'iDesign · OPX Inventory'}])})
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); copyReviewLink(url); toast('Added to Studio Review · requested '+fmtReqDate(Date.now())+' — link copied'); return refreshWebReview(PARTNERS[sel]); });
  }).catch(function(e){ toast('Couldn’t reach Review ('+e.message+')'); refreshWebReview(PARTNERS[sel]); });
}
// Render the Website row for one of 3 states: none / active (requested) / archived.
function refreshWebReview(p){
  var row=document.getElementById('webrow'); if(!row||!p.site) return;
  var siteJs=(p.site||'').replace(/'/g,"\\'"), nameJs=(p.name||'').replace(/'/g,"\\'");
  return fetchLatestReview(p.site).then(function(rev){
    if(!document.getElementById('webrow')) return;
    var active   = rev && rev.archived!==true;
    var archived = rev && rev.archived===true;
    var badge = active   ? ' · <span class="reqbadge">Requested '+fmtReqDate(rev.created_at)+'</span>'
              : archived ? ' · <span class="reqbadge arch">Archived '+fmtReqDate(rev.created_at)+'</span>' : '';
    var main='<div class="rmain"><div class="rname">Program microsite</div><div class="rmeta"><a href="'+esc(p.site)+'" target="_blank" rel="noopener">'+esc(p.site)+'</a>'+badge+'</div></div>';
    var acts;
    if(active){
      acts='<button class="btn primary" onclick="copyReviewLink(\''+siteJs+'\')">Copy review link</button><a class="btn" href="'+reviewDashLink(p.site)+'" target="_blank" rel="noopener">Open in Review ↗</a>';
    } else if(archived){
      acts='<button class="btn primary" onclick="requestReview(this,\''+siteJs+'\',\''+nameJs+'\')">Request again</button><a class="btn" href="'+reviewDashLink(p.site)+'" target="_blank" rel="noopener">Open in Review ↗</a>';
    } else {
      acts='<button class="btn primary" onclick="requestReview(this,\''+siteJs+'\',\''+nameJs+'\')">Share review link</button><a class="btn" href="'+esc(p.site)+'" target="_blank" rel="noopener">Open site ↗</a>';
    }
    document.getElementById('webrow').innerHTML=main+acts;
  });
}
function reqReview(what){toast('“'+what+'” sent to Review ✓');}
function reorder(what){toast('Reorder request logged for '+what+' ✓');}

function renderList(){
  document.getElementById('pcount').textContent=PARTNERS.length;
  document.getElementById('plist').innerHTML=PARTNERS.map(function(p,i){
    var s=statusOf(p);
    return '<div class="prow'+(i===sel?' on':'')+'" onclick="sel='+i+';renderList();renderDetail()">'
      +'<span class="dot '+s+'"></span>'
      +'<div><div class="pn">'+esc(p.name)+'</div><div class="ps">'+STATUS_LABEL[s]+'</div></div></div>';
  }).join('');
}

function pill(state){var m={done:['done','Complete'],pending:['pending','Not started'],na:['na','Not ordered'],revision:['pending','Needs revision'],none:['na','Not started']};var x=m[state]||m.na;return '<span class="pill '+x[0]+'">'+x[1]+'</span>';}

function renderDetail(){
  var p=PARTNERS[sel]; var s=statusOf(p);
  var h='<div class="phead"><h1>'+esc(p.name)+'</h1><span class="statustag '+s+'">'+STATUS_LABEL[s]+'</span></div>';
  h+='<div class="contact">';
  if(p.email) h+='<span><span class="k">Coordinator</span><a href="mailto:'+esc(p.email)+'">'+esc(p.email)+'</a></span>';
  if(p.phone) h+='<span><span class="k">Phone</span>'+esc(p.phone)+'</span>';
  if(p.epd) h+='<span><span class="k">EPD</span>'+esc(p.epd)+'</span>';
  if(!p.email&&!p.phone&&!p.epd) h+='<span class="k">No contact on file</span>';
  h+='</div>';

  // Website
  h+='<div class="sec"><div class="sech"><span class="si">'+IC.web+'</span><h2>Website</h2></div>';
  if(p.site){
    h+='<div id="webrow" class="row"><div class="rmain"><div class="rname">Program microsite</div><div class="rmeta"><a href="'+esc(p.site)+'" target="_blank" rel="noopener">'+esc(p.site)+'</a></div></div><span style="color:var(--muted);font-size:12px">Checking Review…</span></div>';
  } else { h+='<div class="empty">No microsite launched yet.<button class="btn sm" onclick="toast(\'Add microsite URL\')">Add URL</button></div>'; }
  h+='</div>';

  // One-Pagers — collapsible box with a thumbnail of each file
  var op=p.onepagers;
  h+='<div class="sec'+(opOpen?' open':'')+'" id="opsec">'
    +'<button type="button" class="sech secbtn" onclick="toggleOP()"><span class="si">'+IC.doc+'</span><h2>One-Pagers</h2>'
      +'<span class="cnt">'+(p.files&&p.files.length? p.files.length+' one-pager'+(p.files.length===1?'':'s') : (op.total?op.done+' of '+op.total+' programs':'—'))+'</span><span style="flex:1"></span><span class="chev">›</span></button>'
    +'<div class="op-body">';
  if(op.total){
    h+=opThumbs(p);
  } else { h+='<div class="empty" style="padding:14px 0">No one-pagers yet.</div>'; }
  h+='</div></div>';

  // Printed materials (Postcard) — preview image + real audit data
  var pr=p.printed||{status:p.postcard||'none'};
  h+='<div class="sec"><div class="sech"><span class="si">'+IC.print+'</span><h2>Printed materials</h2>'+exBtn+'</div>'
    +'<div class="row">'
    + (pr.img? '<span class="swag-thumb"><img src="'+pr.img+'" alt="Postcard 5x7"></span>':'')
    + '<div class="rmain"><div class="rname">Postcard (5×7)</div><div class="rmeta">'
      + (pr.qty||pr.last? 'Qty '+(pr.qty||'—')+' · Last ordered '+(pr.last||'—') : 'Not ordered yet')
      + (pr.note? ' · <span style="color:#E7B35C">'+esc(pr.note)+'</span>':'') + '</div></div>'
    + pill(pr.status)+'<button class="btn" onclick="reorder(\'Postcard (5×7)\')">Reorder</button></div></div>';

  // SWAG — product images from the audit sheet + real reorder data
  h+='<div class="sec"><div class="sech"><span class="si">'+IC.swag+'</span><h2>SWAG</h2>'+exBtn+'</div>';
  (p.swag||[{item:'Pens',status:p.pens||'na'}]).forEach(function(s){
    h+='<div class="row">'
      + (s.img? '<span class="swag-thumb"><img src="'+s.img+'" alt="'+esc(s.item)+'"></span>':'')
      + '<div class="rmain"><div class="rname">'+esc(s.item)+'</div><div class="rmeta">'
        + (s.qty||s.last? 'Qty '+(s.qty||'—')+' · Last ordered '+(s.last||'—')+(s.vendor?' · '+esc(s.vendor):'') : (s.status==='na'?'Not applicable':'Not ordered yet'))
        + '</div></div>'
      + pill(s.status)+'<button class="btn" onclick="reorder(\''+esc(s.item)+'\')">'+(s.status==='done'?'Reorder':'Order')+'</button></div>';
  });
  h+='</div>';

  // Events
  h+='<div class="sec"><div class="sech"><span class="si">'+IC.event+'</span><h2>Events</h2>'+exBtn+'</div>'
    +'<div class="empty">No event materials tracked yet.<button class="btn sm" onclick="toast(\'Add event material\')">Add item</button></div></div>';

  h+='<div class="note">One-pagers are <b style="color:var(--sub)">HTML → PDF</b> files in <b style="color:var(--sub)">/onepagers/</b> (View opens the live HTML, PDF is the print export). SWAG photos and reorder dates come from the audit sheet; “Share review link” writes a real request to <b style="color:var(--sub)">Studio Review</b>. The Reorder / Order buttons are still demonstrative.</div>';
  document.getElementById('detail').innerHTML=h;
  if(p.site) refreshWebReview(p);
}

renderList(); renderDetail();
// Re-check Review status when the user returns to this tab (e.g. after archiving in Review).
window.addEventListener('focus',function(){ var p=PARTNERS[sel]; if(p&&p.site) refreshWebReview(p); });
</script>
</body>
</html>
